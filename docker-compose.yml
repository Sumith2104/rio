# =============================================================================
# DOCKER COMPOSE CONFIGURATION: PACD-RAG SMART CAMPUS PLATFORM
# AI-Powered Agentic Smart Campus Intelligence & Student Success Platform
# Author: Sumith U (SRN: R24EA807) | REVA University
# =============================================================================
# Services:
#   1. app: PACD-RAG Web Dashboards, REST APIs, ML Models & OKF Diagnostic Engine
#   2. chroma: ChromaDB vector database for embeddings (Syllabus, Notes, Slides)
#   3. mysql: Local relational store for student telemetry & fallback records
# =============================================================================

services:
  # PACD-RAG Unified Application Server (FastAPI + Uvicorn + Glassmorphic UI)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rio_pacd_rag_app
    ports:
      - "8000:8000"
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - SECONDARY_PORT=8002
    env_file:
      - .env
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ChromaDB Vector Database for AI-Powered Embeddings (Part 5 RAG & Cognitive Diagnosis)
  chroma:
    image: chromadb/chroma:latest
    container_name: rio_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Relational Store (Student Profiles, Course Blueprints, Question Bank Items)
  mysql:
    image: mysql:8
    container_name: rio_mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=reva_admin_secret
      - MYSQL_DATABASE=smart_campus_db
      - MYSQL_USER=reva_student
      - MYSQL_PASSWORD=reva_campus_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-preva_admin_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
    driver: local
  mysql_data:
    driver: local
